<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирования — Добровольцы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" id="loginView">
      <a class="back-link" href="index.html">← На сайт</a>
      <div class="brand-kicker">ДОБРОВОЛЬЦЫ</div>
      <h1>Панель бронирований</h1>
      <p class="login-copy">Вход только для организатора концерта.</p>

      <form id="loginForm" class="login-form">
        <label>
          <span>Email</span>
          <input id="adminEmail" type="email" autocomplete="username" required placeholder="organizer@example.ru">
        </label>
        <label>
          <span>Пароль</span>
          <input id="adminPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button class="primary-btn" type="submit" id="loginButton">Войти</button>
        <p class="form-message" id="loginMessage" role="alert"></p>
      </form>
    </section>

    <section class="dashboard hidden" id="dashboardView">
      <header class="dashboard-header">
        <div>
          <a class="back-link" href="index.html">← На сайт</a>
          <div class="brand-kicker">ДОБРОВОЛЬЦЫ</div>
          <h1>Бронирования</h1>
          <p id="adminIdentity" class="muted"></p>
        </div>
        <div class="header-actions">
          <button class="secondary-btn" id="refreshButton" type="button">Обновить</button>
          <button class="secondary-btn" id="exportButton" type="button">Скачать CSV</button>
          <button class="danger-btn" id="logoutButton" type="button">Выйти</button>
        </div>
      </header>

      <div class="stats-grid">
        <article class="stat-card">
          <span>Бронирований</span>
          <strong id="bookingCount">0</strong>
        </article>
        <article class="stat-card">
          <span>Занято мест</span>
          <strong id="seatCount">0</strong>
        </article>
        <article class="stat-card stat-wide">
          <span>Последняя бронь</span>
          <strong id="lastBooking">—</strong>
        </article>
      </div>

      <section class="table-card">
        <div class="table-toolbar">
          <div>
            <h2>Список гостей</h2>
            <p class="muted">ФИО, контакты и все места в одной строке.</p>
          </div>
          <label class="search-box">
            <span class="sr-only">Поиск</span>
            <input id="searchInput" type="search" placeholder="Поиск по ФИО, телефону, email или месту">
          </label>
        </div>

        <div class="status-line" id="statusLine">Загрузка…</div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ФИО</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Места</th>
                <th>Дата брони</th>
              </tr>
            </thead>
            <tbody id="bookingTableBody"></tbody>
          </table>
        </div>

        <div class="empty-state hidden" id="emptyState">Бронирований пока нет.</div>
      </section>
    </section>
  </main>

  <script src="js/config.js?v=3"></script>
  <script src="js/admin.js?v=3"></script>
</body>
</html>
